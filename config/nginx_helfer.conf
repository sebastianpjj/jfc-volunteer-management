# Nginx configuration    passenger_ruby /usr/share/rvm/wrappers/ruby-3.4.2/ruby;for JFC Hands - helfer subdomain
# This file should be placed at /etc/nginx/sites-available/helfer
# Then create a symlink: sudo ln -s /etc/nginx/sites-available/helfer /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name helfer.eintracht-feldberg.net;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name helfer.eintracht-feldberg.net;

    # Document root for the Rails application
    root /var/www/jfc_hands/current/public;

    # Passenger configuration
    passenger_enabled on;
    passenger_ruby /usr/share/rvm/wrappers/ruby-3.2.2/ruby;
    passenger_app_env production;
    passenger_min_instances 1;

    # SSL configuration (matching your existing setup)
    ssl_certificate /etc/letsencrypt/live/eintracht-feldberg.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eintracht-feldberg.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Assets caching
    location ^~ /assets/ {
        gzip_static on;
        expires 1y;
        add_header Cache-Control public;
        add_header Last-Modified "";
        add_header ETag "";
        break;
    }

    # Error pages
    error_page 500 502 503 504 /500.html;
    client_max_body_size 10M;
    keepalive_timeout 10;

    # Logs
    access_log /var/log/nginx/helfer_access.log;
    error_log /var/log/nginx/helfer_error.log info;
}
